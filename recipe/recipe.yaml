context:
  version: "2.0.30"

package:
  name: autohotkey
  version: ${{ version }}

source:
  url: https://github.com/AutoHotkey/AutoHotkey/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 6646a1618b1edc089590e0a01c62cbc304fbef657cf93cc8e2460bf9a3667cce
  patches:
    # The release tarball has no .git directory, so the version cannot be read via
    # `git describe`. Allow it to be supplied through /p:RawAhkVersion instead.
    - ahkversion.patch

build:
  number: 0
  skip: not win
  script: build.bat

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}

tests:
  - files:
      recipe:
        - run_test.ahk
        - run_test.bat
    script:
      - run_test.bat

about:
  homepage: https://www.autohotkey.com/
  repository: https://github.com/AutoHotkey/AutoHotkey
  summary: Macro-creation and automation software utility for Windows
  description: |
    AutoHotkey is a free, open source macro-creation and automation software
    utility that allows users to automate repetitive tasks. It is driven by a
    custom scripting language that has special provision for defining keyboard
    shortcuts, otherwise known as hotkeys.
  license: GPL-2.0-or-later AND BSD-3-Clause
  license_file:
    - license.txt
    - source/lib_pcre/pcre/LICENCE

extra:
  recipe-maintainers:
    - ytausch
